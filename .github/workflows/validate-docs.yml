name: Validate Part 1 Documents

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check README
        run: test -f README.md

      - name: Check docs folder
        run: test -d docs

      - name: Check ERD
        run: test -f docs/RaceDay_ERD.png

      - name: Check API Endpoint Plan
        run: test -f docs/RaceDay_API_Endpoint_Plan.pdf

      - name: Check SQL Database Script
        run: test -f docs/RaceDay_Database.sql

      - name: Validation complete
        run: echo "RaceDay Part 1 required files are present."
